name: Scientific checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      # Official action commits also used by the supplied integrity workflow.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Current lifecycle table and full raw-row accounting
        run: |
          python -B -m unittest tests.lifecycle_table_regression -v
          python -B -O -m unittest tests.lifecycle_table_regression -v
      - name: Profile encoding and evidence-preservation regressions
        run: |
          mkdir -p "$RUNNER_TEMP/P011-scientific-logs"
          timeout --signal=TERM --kill-after=15s 120s python -B -m unittest tests.profile_bounds tests.output_paths -v > "$RUNNER_TEMP/P011-scientific-logs/regressions.stdout.log" 2> "$RUNNER_TEMP/P011-scientific-logs/regressions.stderr.log"
      - name: Full-powerset positive-contract oracle
        run: timeout --signal=TERM --kill-after=15s 120s python -B -m tests.positive_oracle > "$RUNNER_TEMP/P011-scientific-logs/positive.stdout.log" 2> "$RUNNER_TEMP/P011-scientific-logs/positive.stderr.log"
      - name: Complete finite term-membership regressions
        run: timeout --signal=TERM --kill-after=15s 180s python -B tests/term_membership_regression.py -v > "$RUNNER_TEMP/P011-scientific-logs/term-membership.stdout.log" 2> "$RUNNER_TEMP/P011-scientific-logs/term-membership.stderr.log"
      - name: Current durable publication and direct reply conformance
        run: |
          python -B -m tests.persistence_failures --report "$RUNNER_TEMP/P011-scientific-logs/owner-persistence.json" > "$RUNNER_TEMP/P011-scientific-logs/owner-persistence.stdout.log" 2> "$RUNNER_TEMP/P011-scientific-logs/owner-persistence.stderr.log"
          python -B -m tests.origin_persistence_failures --report "$RUNNER_TEMP/P011-scientific-logs/origin-persistence.json" > "$RUNNER_TEMP/P011-scientific-logs/origin-persistence.stdout.log" 2> "$RUNNER_TEMP/P011-scientific-logs/origin-persistence.stderr.log"
          python -B -m tests.window_types > "$RUNNER_TEMP/P011-scientific-logs/window-types.stdout.log" 2> "$RUNNER_TEMP/P011-scientific-logs/window-types.stderr.log"
          python -B -m tests.closed_objects > "$RUNNER_TEMP/P011-scientific-logs/closed-objects.stdout.log" 2> "$RUNNER_TEMP/P011-scientific-logs/closed-objects.stderr.log"
          python -B -m tests.receipt_snapshots --out "$RUNNER_TEMP/P011-reply-isolation" > "$RUNNER_TEMP/P011-scientific-logs/reply-isolation.stdout.log" 2> "$RUNNER_TEMP/P011-scientific-logs/reply-isolation.stderr.log"
      - name: Standard labelled-MSS same-information comparison
        run: python -B -m tests.labelled_mss_bridge --out "$RUNNER_TEMP/P011-mss-comparison" > "$RUNNER_TEMP/P011-scientific-logs/mss.stdout.log" 2> "$RUNNER_TEMP/P011-scientific-logs/mss.stderr.log"
      - name: Explicit finite-batch choice regressions
        run: timeout --signal=TERM --kill-after=15s 120s python -B -m unittest tests.batch_choice -v > "$RUNNER_TEMP/P011-scientific-logs/batch-choice.stdout.log" 2> "$RUNNER_TEMP/P011-scientific-logs/batch-choice.stderr.log"
      - name: Mask equivalence and complete durable lifecycle regression
        run: timeout --signal=TERM --kill-after=15s 180s python -B -m unittest tests.mask_safety tests.cost_path_regression -v > "$RUNNER_TEMP/P011-scientific-logs/lifecycle.stdout.log" 2> "$RUNNER_TEMP/P011-scientific-logs/lifecycle.stderr.log"
      - name: Optimized lifecycle checks retain execution and reject contradictory results
        run: timeout --signal=TERM --kill-after=15s 180s python -O -B -m unittest tests.cost_path_regression tests.window_types -v > "$RUNNER_TEMP/P011-scientific-logs/optimized-lifecycle.stdout.log" 2> "$RUNNER_TEMP/P011-scientific-logs/optimized-lifecycle.stderr.log"
      - name: Retained offline scientific suite and semantic comparison
        run: timeout --signal=TERM --kill-after=15s 1500s python -B reproduce.py --out "$RUNNER_TEMP/P011-scientific-results" --check-reference results > "$RUNNER_TEMP/P011-scientific-logs/reproduction.stdout.log" 2> "$RUNNER_TEMP/P011-scientific-logs/reproduction.stderr.log"
      - name: Retain actual scientific output and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rolloutfrontier-scientific-results
          path: |
            ${{ runner.temp }}/P011-scientific-results
            ${{ runner.temp }}/P011-scientific-logs
            ${{ runner.temp }}/P011-reply-isolation
            ${{ runner.temp }}/P011-mss-comparison
          if-no-files-found: warn
          retention-days: 14
